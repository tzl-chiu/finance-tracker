<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>確認刪除</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>確定要刪除這筆交易嗎？</h1>
        <p>{{ transaction.date }} - {{ transaction.amount }} 元 - {{ transaction.note }}</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">確認刪除</button>
            <a href="{% url 'transaction_list' %}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</body>
</html>
