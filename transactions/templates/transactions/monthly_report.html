<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>每月財務報告</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">📊 {{ month }} 財務分析報告</h1>

        <div class="card">
            <div class="card-body">
                <p class="card-text" style="white-space: pre-line;">{{ report }}</p>
            </div>
        </div>

        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mt-3">回到儀表板</a>
    </div>
</body>

</html>
