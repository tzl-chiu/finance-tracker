<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>財務儀表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <div class="container mt-5">
        <h1 class="mb-4">財務儀表板</h1>
<div class="mb-4">
    <select id="monthSelect" class="form-select w-auto">
        <option value="all">全部</option>
    </select>
</div>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">支出分類圓餅圖</h5>
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>
        </div>


        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">每月收支折線圖</h5>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
    </div>


   

    <script>
        fetch('/api/transactions/', { credentials: 'same-origin' })
            .then(response => response.json())
            .then(data => {

                // 取得所有月份放進下拉選單
                const months = [...new Set(data.map(t => t.date.substring(0, 7)))].sort();
                const select = document.getElementById('monthSelect');
                months.forEach(m => {
                    const option = document.createElement('option');
                    option.value = m;
                    option.text = m;
                    select.appendChild(option);
                });

                // 畫圖的 function
                function drawCharts(filtered) {

                    // 圓餅圖
                    const categoryMap = {};
                    filtered.filter(t => t.category_type === 'expense').forEach(t => {
                        const cat = t.category_name;
                        categoryMap[cat] = (categoryMap[cat] || 0) + parseInt(t.amount);
                    });

                    // 折線圖
                    const monthlyData = {};
                    filtered.forEach(t => {
                        const month = t.date.substring(0, 7);
                        if (!monthlyData[month]) monthlyData[month] = { income: 0, expense: 0 };
                        if (t.category_type === 'income') {
                            monthlyData[month].income += parseInt(t.amount);
                        } else {
                            monthlyData[month].expense += parseInt(t.amount);
                        }
                    });

                    // 清除舊圖表
                    Chart.getChart('expenseChart')?.destroy();
                    Chart.getChart('lineChart')?.destroy();

                    // 畫圓餅圖
                    new Chart(document.getElementById('expenseChart'), {
                        type: 'pie',
                        data: {
                            labels: Object.keys(categoryMap),
                            datasets: [{ data: Object.values(categoryMap), backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'] }]
                        },
                        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                    });

                    // 畫折線圖或長條圖（只有一個月用長條圖）
                    const monthKeys = Object.keys(monthlyData).sort();
                    const chartType = monthKeys.length === 1 ? 'bar' : 'line';
                    new Chart(document.getElementById('lineChart'), {
                        type: chartType,
                        data: {
                            labels: monthKeys,
                            datasets: [
                                { label: '收入', data: monthKeys.map(m => monthlyData[m].income), borderColor: '#36A2EB', backgroundColor: '#36A2EB' , tension: 0.3 },
                                { label: '支出', data: monthKeys.map(m => monthlyData[m].expense), borderColor: '#FF6384', backgroundColor: '#FF6384', tension: 0.3 }
                            ]
                        },
                        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                    });
                }

                // 第一次載入顯示全部
                drawCharts(data);

                // 下拉選單切換時重新畫圖
                select.addEventListener('change', () => {
                    const selected = select.value;
                    const filtered = selected === 'all' ? data : data.filter(t => t.date.startsWith(selected));
                    drawCharts(filtered);
                });
            });
    </script>
</body>
</html>
