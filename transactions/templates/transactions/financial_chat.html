<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>財務問答</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">💬 智慧財務問答</h1>
        <p class="text-muted">用自然語言詢問你的財務狀況，例如：「我這個月餐飲花了多少？」</p>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="question" class="form-control form-control-lg" placeholder="輸入你的問題..."
                    autofocus>
            </div>
            <button type="submit" class="btn btn-primary">送出問題</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">回到儀表板</a>
        </form>

        {% if answer %}
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">🤖 AI 回答</h5>
                <p class="card-text">{{ answer }}</p>
            </div>
        </div>
        {% endif %}
    </div>
</body>

</html>
